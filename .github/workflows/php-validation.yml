name: Builder PHP validation

on:
  push:
    branches: [main]
    paths:
      - "public/**"
      - "docker/**"
      - "Dockerfile"
      - ".github/workflows/php-validation.yml"
  pull_request:
    paths:
      - "public/**"
      - "docker/**"
      - "Dockerfile"
      - ".github/workflows/php-validation.yml"

jobs:
  php-lint-and-health:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: curl, zip
          coverage: none

      - name: PHP syntax validation
        run: php -l public/index.php

      - name: Verify runtime entrypoint
        run: test -f docker/entrypoint.sh

      - name: Smoke-test health endpoint
        shell: bash
        run: |
          php -S 127.0.0.1:8080 -t public public/index.php > /tmp/nira-builder-php.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:8080/health; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/nira-builder-php.log
          exit 1
