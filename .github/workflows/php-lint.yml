name: PHP syntax validation

on:
  push:
    branches: [main]
  pull_request:

jobs:
  php-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - name: Validate PHP syntax
        run: php -l public/index.php
      - name: Validate shell script
        run: sh -n docker/entrypoint.sh
