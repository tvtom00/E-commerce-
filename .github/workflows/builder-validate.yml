name: Builder PHP validation

on:
  push:
    branches:
      - main
      - fix/enforce-laravel-ecommerce-output
  pull_request:
    branches:
      - main

jobs:
  php-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: curl, zip, json
      - name: Check builder PHP syntax
        run: php -l public/index.php
      - name: Check download endpoint syntax
        run: php -l public/download.php
